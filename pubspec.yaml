name: soundwave
description: Aplicativo musical acadêmico em Flutter, com catálogo local.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Registro explícito do plugin e decodificação de mídia nos testes de navegador.
  shared_preferences_web: ^2.4.3
  web: ^1.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/audio_manifest.json
